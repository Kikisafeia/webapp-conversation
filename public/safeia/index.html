<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>SAFEIA · Cómo construiremos una WebApp SST con IA</title>
<meta name="description" content="Presentación simple SAFEIA: qué haremos, cómo lo haremos y un ejemplo claro en cada paso." />
<style>
:root{--bg:#050505;--panel:#101010;--panel2:#171717;--line:#2b2b2b;--text:#fafafa;--muted:#b4b4b4;--yellow:#ffd400;--green:#4ade80;--red:#fb7185}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button{font:inherit}
body{overflow-x:hidden}.app{min-height:100vh;display:grid;grid-template-rows:auto 1fr auto}
header{position:sticky;top:0;z-index:20;height:72px;display:flex;align-items:center;gap:18px;padding:10px 28px;border-bottom:1px solid var(--line);background:rgba(5,5,5,.94);backdrop-filter:blur(14px)}
.logo{width:155px;height:auto;display:block}.header-title{font-size:13px;font-weight:850;letter-spacing:.01em;white-space:nowrap}.progress-wrap{flex:1;display:flex;align-items:center;gap:12px;min-width:100px}.progress{height:6px;flex:1;background:#222;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:var(--yellow);width:0;transition:.35s ease}.count{font-size:11px;color:#8d8d8d;font-weight:800;min-width:64px;text-align:right}.header-actions{display:flex;gap:8px}
.btn{border:1px solid #333;background:#111;color:#eee;border-radius:10px;padding:9px 12px;font-weight:800;font-size:12px;cursor:pointer}.btn:hover{border-color:#555}.btn.primary{background:var(--yellow);color:#090909;border-color:var(--yellow)}
main{display:grid;place-items:center;padding:34px 28px 24px}.slide{width:min(1180px,100%);min-height:620px;display:grid;grid-template-columns:minmax(0,1.22fr) minmax(320px,.78fr);gap:22px;animation:enter .35s ease both}@keyframes enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.left{display:flex;flex-direction:column;gap:18px}.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--yellow);font-weight:900}h1{font-size:clamp(36px,5vw,68px);line-height:.98;margin:0;letter-spacing:-.045em;max-width:900px}.tag{font-size:18px;color:var(--muted);margin:0;max-width:760px;line-height:1.5}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card{border:1px solid var(--line);background:var(--panel);border-radius:18px;padding:20px}.card .label{font-size:11px;text-transform:uppercase;letter-spacing:.13em;color:#8d8d8d;font-weight:900;margin-bottom:9px}.card h2{font-size:22px;margin:0 0 8px}.card p{margin:0;color:#d2d2d2;line-height:1.55;font-size:15px}.what{border-top:3px solid var(--yellow)}.how{border-top:3px solid #fff}
.example{border:1px solid #4a4215;background:#171506;border-radius:18px;padding:18px 20px}.example .label{color:#fff0a1;font-size:11px;text-transform:uppercase;letter-spacing:.12em;font-weight:900;margin-bottom:8px}.example p{margin:0;font-size:16px;line-height:1.55;color:#fff7cf}.result{display:flex;align-items:flex-start;gap:12px;border-left:4px solid var(--green);padding:12px 0 12px 16px}.result b{display:block;margin-bottom:3px}.result span{color:var(--muted);font-size:14px;line-height:1.45}
.visual{border:1px solid var(--line);background:linear-gradient(180deg,#111,#090909);border-radius:22px;padding:22px;display:flex;flex-direction:column;min-height:100%;overflow:hidden;position:relative}.visual-title{font-size:11px;text-transform:uppercase;letter-spacing:.13em;color:#777;font-weight:900}.visual-stage{flex:1;display:grid;place-items:center;min-height:420px}.visual-note{font-size:12px;color:#858585;line-height:1.4;border-top:1px solid #242424;padding-top:12px}
.flowline{display:grid;gap:12px;width:100%}.node{border:1px solid #333;background:#161616;border-radius:14px;padding:15px 16px;font-weight:850;position:relative;opacity:.35;transform:translateX(8px);animation:nodeIn .35s forwards}.node:nth-child(2){animation-delay:.35s}.node:nth-child(3){animation-delay:.7s}.node:nth-child(4){animation-delay:1.05s}.node:nth-child(5){animation-delay:1.4s}@keyframes nodeIn{to{opacity:1;transform:none;border-color:#5b5010}}.node strong{color:var(--yellow);margin-right:8px}
.phone{width:230px;border:8px solid #2a2a2a;border-radius:34px;background:#080808;padding:15px;box-shadow:0 30px 70px rgba(0,0,0,.45)}.phonebar{height:20px;width:80px;border-radius:99px;background:#202020;margin:0 auto 18px}.phone .action{background:var(--yellow);color:#090909;font-weight:900;padding:14px;border-radius:12px;text-align:center;margin-bottom:12px}.field{height:42px;border:1px solid #303030;background:#121212;border-radius:10px;margin:9px 0;display:flex;align-items:center;padding:0 11px;color:#858585;font-size:12px}.photo{height:110px;border:1px dashed #555;border-radius:12px;display:grid;place-items:center;color:#777;margin:10px 0}
.scope{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:12px}.scope .box{border:1px solid #333;border-radius:15px;padding:17px}.scope h3{margin:0 0 12px;font-size:14px}.scope .yes h3{color:var(--green)}.scope .no h3{color:#999}.mini{padding:8px 0;border-top:1px solid #292929;font-size:12px;color:#ccc}
.promptbox{width:100%;border:1px solid #3c3510;background:#141207;border-radius:16px;padding:20px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:#f5ecc0;font-size:13px;line-height:1.6;position:relative}.cursor{display:inline-block;width:8px;height:15px;background:var(--yellow);vertical-align:-2px;animation:blink .8s infinite}@keyframes blink{50%{opacity:0}}
.pev{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}.circle{width:120px;height:120px;border-radius:50%;display:grid;place-items:center;border:2px solid #333;background:#111;text-align:center;font-weight:900}.circle.active{border-color:var(--yellow);box-shadow:0 0 0 7px rgba(255,212,0,.08)}.arrow{font-size:28px;color:#555}
.compare{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:12px}.mock{border:1px solid #333;border-radius:15px;padding:14px;min-height:280px}.mock b{font-size:12px}.mock .bad{color:#999}.mock .good{color:var(--green)}.mockfield{height:38px;background:#1b1b1b;border-radius:9px;margin-top:10px;border:1px solid #292929}.mockfield.big{height:90px}.mockbtn{height:44px;border-radius:10px;background:#2a2a2a;margin-top:12px}.mock:nth-child(2) .mockbtn{background:var(--yellow)}
.checks{width:100%;display:grid;gap:10px}.check{padding:15px;border:1px solid #333;border-radius:13px;background:#121212;display:flex;gap:10px;align-items:center;opacity:.35;animation:checkIn .35s forwards}.check:nth-child(2){animation-delay:.35s}.check:nth-child(3){animation-delay:.7s}.check:nth-child(4){animation-delay:1.05s}@keyframes checkIn{to{opacity:1;border-color:#31523c}}.tick{color:var(--green);font-weight:1000}
.deploy{display:grid;gap:14px;width:100%}.deployrow{display:flex;align-items:center;gap:12px}.dot{width:16px;height:16px;border-radius:50%;background:#292929}.dot.on{background:var(--green);box-shadow:0 0 0 7px rgba(74,222,128,.08)}.bar{height:10px;flex:1;background:#202020;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--yellow);animation:fill 1.8s ease forwards}@keyframes fill{from{width:0}to{width:100%}}.url{border:1px solid #31523c;background:#0d1710;border-radius:13px;padding:15px;color:#baf5cc;font-family:ui-monospace,monospace;font-size:12px}
.cover{grid-template-columns:1fr}.cover .left{justify-content:center;min-height:620px;max-width:950px}.cover h1{font-size:clamp(48px,7vw,88px)}.formula{margin-top:10px;display:flex;gap:10px;flex-wrap:wrap}.pill{border:1px solid #3d3611;background:#151306;color:#fff4ad;padding:10px 13px;border-radius:999px;font-weight:850;font-size:12px}
footer{height:68px;display:flex;align-items:center;justify-content:space-between;padding:10px 28px;border-top:1px solid var(--line);background:#080808}.footerhint{font-size:12px;color:#737373}.nav{display:flex;gap:8px}
@media(max-width:900px){header{padding:10px 16px}.header-title,.header-actions .secondary{display:none}main{padding:22px 14px}.slide{grid-template-columns:1fr;min-height:auto}.visual{min-height:430px}.twocol{grid-template-columns:1fr}footer{padding:10px 16px}}
</style>
</head>

const slides=[{"n": "01", "title": "Entender el problema", "tag": "Antes de construir, entendemos qué está fallando.", "what": "Definir en una frase el problema real que queremos resolver.", "how": "Mostraremos cómo se hace hoy el proceso y dónde se pierde tiempo, información o trazabilidad.", "example": "Un trabajador ve un cable eléctrico expuesto. Lo avisa por WhatsApp, pero nadie registra quién debe corregirlo ni cuándo.", "result": "Problema definido: necesitamos registrar, asignar, verificar y cerrar hallazgos sin perder trazabilidad.", "visual": "problem"}, {"n": "02", "title": "Definir la primera versión", "tag": "No intentamos construir todo de una vez.", "what": "Elegir qué debe hacer la primera versión de la WebApp y qué dejaremos para después.", "how": "Separaremos funciones esenciales de funciones futuras y congelaremos un MVP pequeño y demostrable.", "example": "Incluye: foto Antes, ubicación, responsable, fecha compromiso, foto Después y aprobación de cierre. No incluye todavía mapas de calor ni reportes avanzados.", "result": "Un MVP concreto que podemos construir y probar durante el taller.", "visual": "mvp"}, {"n": "03", "title": "Dibujar el flujo", "tag": "La aplicación debe seguir el trabajo real.", "what": "Ordenar las acciones desde que aparece el hallazgo hasta que queda cerrado.", "how": "Convertiremos el proceso en una secuencia simple de estados y responsables.", "example": "Reporte creado → responsable asignado → acción ejecutada → evidencia cargada → SST verifica → cierre confirmado.", "result": "Un flujo que el agente puede entender y transformar en pantallas y lógica.", "visual": "flow"}, {"n": "04", "title": "Preparar la instrucción para la IA", "tag": "Un buen resultado comienza con una buena instrucción.", "what": "Crear un prompt maestro con contexto, usuarios, datos, reglas y límites.", "how": "Le diremos al agente qué problema resuelve la WebApp, qué debe construir primero y qué decisiones debe dejar al profesional SST.", "example": "“Construye una WebApp mobile-first para reportar condiciones inseguras. Antes de programar, entrega un plan. No inventes requisitos y no expongas claves en el navegador.”", "result": "Una instrucción clara para trabajar con ChatGPT/Codex, Claude o Antigravity.", "visual": "prompt"}, {"n": "05", "title": "Construir con el agente", "tag": "Primero planificamos. Después construimos.", "what": "Pasar del prompt a una primera versión funcional.", "how": "Usaremos el ciclo PEV: Planificar → Ejecutar → Verificar. Revisaremos el plan antes de que el agente modifique archivos.", "example": "El agente propone las pantallas, el modelo de datos y el flujo. Lo aprobamos y recién entonces genera la WebApp.", "result": "Primera versión navegable del MVP, sin agregar funciones fuera del alcance.", "visual": "pev"}, {"n": "06", "title": "Mejorar con una Skill", "tag": "No reescribimos todo: mejoramos lo que importa.", "what": "Crear una instrucción reutilizable para revisar la WebApp con los mismos criterios cada vez.", "how": "Aplicaremos una Skill “Revisor SAFEIA” que revise claridad, uso en terreno, coherencia SST y seguridad.", "example": "La Skill detecta que el formulario tiene demasiados campos y propone dejar solo foto, ubicación y descripción en el primer paso.", "result": "Una segunda versión más simple y usable, manteniendo lo que ya funcionaba.", "visual": "skill"}, {"n": "07", "title": "Probar y validar", "tag": "Que funcione no significa que esté lista.", "what": "Comprobar flujo, permisos, errores y límites de la IA antes de usar datos reales.", "how": "Probamos el caso normal y también situaciones incorrectas: campos vacíos, usuario sin permiso, evidencia faltante o intento de cierre anticipado.", "example": "Si no existe foto Después, el sistema no permite cerrar. Si la IA sugiere una prioridad, el profesional SST debe confirmarla.", "result": "Una WebApp con controles claros: IA propone → sistema valida → humano confirma.", "visual": "test"}, {"n": "08", "title": "Publicar y mostrar", "tag": "La última etapa es convertir el trabajo en una URL.", "what": "Publicar la versión validada y recorrer el caso completo frente a la audiencia.", "how": "Generaremos una vista previa, revisaremos una última vez y luego desplegaremos en Vercel.", "example": "Abrimos la URL desde un celular: registramos HALL-2026-001, asignamos a mantenimiento, cargamos foto Después y SST aprueba el cierre.", "result": "Una WebApp SST funcional, demostrable y lista para seguir iterando.", "visual": "deploy"}];
